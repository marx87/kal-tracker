name: Android signed release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versione SemVer, per esempio 0.1.0
        required: true
        type: string
      build_number:
        description: VersionCode Android strettamente crescente
        required: true
        type: number
      source_commit:
        description: Commit sorgente presente nella storia di main (SHA completo)
        required: true
        type: string
      notes:
        description: Note di rilascio
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    env:
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_NOTES: ${{ inputs.notes }}
      RELEASES_REPO: marx87/kal-tracker-releases
      OTA_PUBLIC_KEY_BASE64: ${{ vars.OTA_PUBLIC_KEY_BASE64 }}
      OTA_KEY_ID: ota-2026-01
      EXPECTED_SIGNER_SHA256: ${{ vars.ANDROID_SIGNER_SHA256 }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout trusted release tooling from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Test release tooling without secrets
        run: ../../scripts/tests/release_tooling_test.sh

      - name: Preserve trusted release tooling
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/release-tooling"
          install -m 700 \
            ../../scripts/check_ota_monotonicity.sh \
            ../../scripts/check_latest_ota_release.sh \
            "$RUNNER_TEMP/release-tooling/"

      - name: Checkout selected source commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source selection and public configuration
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "marx87/kal-tracker" ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          IFS=. read -r VERSION_MAJOR VERSION_MINOR VERSION_PATCH <<<"$VERSION"
          for VERSION_COMPONENT in "$VERSION_MAJOR" "$VERSION_MINOR" "$VERSION_PATCH"; do
            (( ${#VERSION_COMPONENT} <= 10 ))
            (( 10#$VERSION_COMPONENT <= 2147483647 ))
          done
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
          (( ${#BUILD_NUMBER} <= 10 ))
          (( BUILD_NUMBER <= 2100000000 ))
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          RELEASE_SOURCE_SHA="$(git rev-parse HEAD)"
          [[ "$RELEASE_SOURCE_SHA" == "$SOURCE_COMMIT" ]]
          git cat-file -e "$GITHUB_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" "$GITHUB_SHA"
          printf 'RELEASE_SOURCE_SHA=%s\n' "$RELEASE_SOURCE_SHA" >> "$GITHUB_ENV"
          [[ -n "${RELEASE_NOTES// }" ]]
          (( ${#RELEASE_NOTES} <= 10000 ))
          [[ -n "$OTA_PUBLIC_KEY_BASE64" ]]
          [[ "$EXPECTED_SIGNER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(printf '%s' "$OTA_PUBLIC_KEY_BASE64" | openssl base64 -d -A | wc -c | tr -d '[:space:]')" -eq 32 ]]

      - name: Reject rollback against signed latest release
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-tooling/check_latest_ota_release.sh" \
            --candidate-version "$VERSION" \
            --candidate-build "$BUILD_NUMBER" \
            --public-key-base64 "$OTA_PUBLIC_KEY_BASE64" \
            --expected-key-id "$OTA_KEY_ID" \
            --source-repo "$GITHUB_REPOSITORY" \
            --releases-repo "$RELEASES_REPO"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Test source before loading signing secrets
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build
          git diff --exit-code -- lib/core/database/app_database.g.dart
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]]
          [[ -n "$ANDROID_KEY_ALIAS" ]]
          [[ -n "$ANDROID_STORE_PASSWORD" ]]
          [[ -n "$ANDROID_KEY_PASSWORD" ]]
          [[ ! -e android/key.properties && ! -L android/key.properties ]]
          ANDROID_SIGNING_DIR="$(mktemp -d "$RUNNER_TEMP/kal-android-signing.XXXXXX")"
          chmod 700 "$ANDROID_SIGNING_DIR"
          printf 'ANDROID_SIGNING_DIR=%s\n' "$ANDROID_SIGNING_DIR" >> "$GITHUB_ENV"
          KEYSTORE_PATH="$ANDROID_SIGNING_DIR/kal-tracker-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | openssl base64 -d -A > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
            printf 'storePassword=%s\n' "$ANDROID_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties

      - name: Build signed APK
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=OTA_PUBLIC_KEY_BASE64="$OTA_PUBLIC_KEY_BASE64" \
            --dart-define=OTA_KEY_ID="$OTA_KEY_ID" \
            --dart-define=OTA_CHANNEL=personal

      - name: Remove Android signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f -- android/key.properties
          if [[ -n "${ANDROID_SIGNING_DIR:-}" && -d "$ANDROID_SIGNING_DIR" ]]; then
            rm -f -- "$ANDROID_SIGNING_DIR/kal-tracker-release.jks"
            rmdir "$ANDROID_SIGNING_DIR"
          fi

      - name: Validate APK, sign manifest and stage assets
        env:
          OTA_PRIVATE_KEY_BASE64: ${{ secrets.OTA_ED25519_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 1; }
          [[ -n "$OTA_PRIVATE_KEY_BASE64" ]] || fail "secret OTA_ED25519_PRIVATE_KEY_BASE64 vuoto"
          APK=build/app/outputs/flutter-apk/app-release.apk
          [[ -f "$APK" && ! -L "$APK" ]] || fail "APK non trovato: $PWD/$APK"

          sha256_file() {
            local digest
            digest="$(openssl dgst -sha256 -r "$1" | awk '{print tolower($1)}')"
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::digest sha256 non valido per $1" >&2; exit 1; }
            printf '%s' "$digest"
          }

          file_size() {
            wc -c <"$1" | tr -d '[:space:]'
          }

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          # aapt (v1) non esiste piu' nelle build-tools recenti: si usa aapt2.
          AAPT2="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          if [[ ! -x "$AAPT2" || ! -x "$APKSIGNER" ]]; then
            echo "::error::aapt2 o apksigner mancanti in $BUILD_TOOLS" >&2
            exit 1
          fi

          # Output catturato per intero: niente head/exit a valle di una pipe (SIGPIPE con pipefail).
          BADGING_FULL="$("$AAPT2" dump badging "$APK")"
          BADGING="${BADGING_FULL%%$'\n'*}"
          PACKAGE="$(sed -n "s/package: name='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          APK_VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          APK_BUILD="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          if [[ "$PACKAGE" != "it.marcomartelli.kaltracker" || "$APK_VERSION" != "$VERSION" || "$APK_BUILD" != "$BUILD_NUMBER" ]]; then
            echo "::error::badging inatteso: package=$PACKAGE version=$APK_VERSION build=$APK_BUILD" >&2
            exit 1
          fi
          echo "badging ok: package=$PACKAGE version=$APK_VERSION build=$APK_BUILD"

          SIGNER_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          ACTUAL_SIGNER="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($2); exit}' <<<"$SIGNER_OUTPUT" | tr -d ':[:space:]')"
          EXPECTED_SIGNER="$(tr '[:upper:]' '[:lower:]' <<<"$EXPECTED_SIGNER_SHA256" | tr -d ':[:space:]')"
          [[ "$ACTUAL_SIGNER" =~ ^[0-9a-f]{64}$ ]] || fail "impronta firmatario non estratta da apksigner (output: ${SIGNER_OUTPUT:0:200})"
          [[ "$ACTUAL_SIGNER" == "$EXPECTED_SIGNER" ]] || fail "firmatario APK $ACTUAL_SIGNER diverso dall'atteso $EXPECTED_SIGNER"
          echo "firma APK ok: $ACTUAL_SIGNER"

          TAG="v${VERSION}-b${BUILD_NUMBER}"
          APK_NAME="kal-tracker-${TAG}.apk"
          ASSET_URL="https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${APK_NAME}"
          STAGE="$RUNNER_TEMP/kal-release"
          [[ ! -e "$STAGE" ]] || fail "stage $STAGE gia' esistente"
          mkdir -m 700 "$STAGE"
          cp "$APK" "$STAGE/$APK_NAME"
          APK_SHA="$(sha256_file "$STAGE/$APK_NAME")"
          APK_SIZE="$(file_size "$STAGE/$APK_NAME")"
          (( APK_SIZE > 0 && APK_SIZE <= 314572800 )) || fail "dimensione APK fuori range: $APK_SIZE byte"
          echo "stage pronto: $APK_NAME ($APK_SIZE byte)"

          jq -n \
            --arg applicationId "it.marcomartelli.kaltracker" \
            --arg platform "android" \
            --arg channel "personal" \
            --arg version "$VERSION" \
            --argjson buildNumber "$BUILD_NUMBER" \
            --argjson minimumSupportedBuild 1 \
            --arg tag "$TAG" \
            --arg assetUrl "$ASSET_URL" \
            --arg sha256 "$APK_SHA" \
            --argjson sizeBytes "$APK_SIZE" \
            --arg notes "$RELEASE_NOTES" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sourceRepository "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$RELEASE_SOURCE_SHA" \
            --arg workflowCommit "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg workflowRun "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg releaseRepository "$RELEASES_REPO" \
            '{applicationId:$applicationId,platform:$platform,channel:$channel,
              version:$version,buildNumber:$buildNumber,
              minimumSupportedBuild:$minimumSupportedBuild,tag:$tag,
              assetUrl:$assetUrl,sha256:$sha256,sizeBytes:$sizeBytes,
              notes:$notes,publishedAt:$publishedAt,
              sourceRepository:$sourceRepository,sourceCommit:$sourceCommit,
              workflowCommit:$workflowCommit,workflowRef:$workflowRef,
              workflowRun:$workflowRun,workflowRunAttempt:$workflowRunAttempt,
              releaseRepository:$releaseRepository}' \
            > "$STAGE/payload.json"

          OTA_KEY_TEMP="$(mktemp -d "$RUNNER_TEMP/kal-ota-key.XXXXXX")"
          chmod 700 "$OTA_KEY_TEMP"
          printf 'OTA_KEY_TEMP=%s\n' "$OTA_KEY_TEMP" >> "$GITHUB_ENV"
          PRIVATE_KEY="$OTA_KEY_TEMP/private.pem"
          PUBLIC_KEY="$OTA_KEY_TEMP/public.pem"
          trap 'rm -f "$PRIVATE_KEY" "$PUBLIC_KEY"; rmdir "$OTA_KEY_TEMP" 2>/dev/null || true' EXIT
          printf '%s' "$OTA_PRIVATE_KEY_BASE64" | openssl base64 -d -A > "$PRIVATE_KEY"
          chmod 600 "$PRIVATE_KEY"
          DERIVED_PUBLIC="$(openssl pkey -in "$PRIVATE_KEY" -pubout -outform DER | tail -c 32 | openssl base64 -A)"
          [[ "$DERIVED_PUBLIC" == "$OTA_PUBLIC_KEY_BASE64" ]] || fail "chiave OTA privata non corrisponde alla pubblica attesa (derivata: $DERIVED_PUBLIC)"
          echo "chiave OTA verificata"
          openssl pkey -in "$PRIVATE_KEY" -pubout -out "$PUBLIC_KEY"
          openssl pkeyutl -sign -rawin -inkey "$PRIVATE_KEY" \
            -in "$STAGE/payload.json" -out "$STAGE/signature.bin"
          openssl pkeyutl -verify -rawin -pubin -inkey "$PUBLIC_KEY" \
            -in "$STAGE/payload.json" -sigfile "$STAGE/signature.bin"

          PAYLOAD_B64="$(openssl base64 -A -in "$STAGE/payload.json" | tr '+/' '-_' | tr -d '=')"
          SIGNATURE_B64="$(openssl base64 -A -in "$STAGE/signature.bin" | tr '+/' '-_' | tr -d '=')"
          jq -n --argjson schema 1 --arg keyId "$OTA_KEY_ID" \
            --arg payload "$PAYLOAD_B64" --arg signature "$SIGNATURE_B64" \
            '{schema:$schema,keyId:$keyId,payload:$payload,signature:$signature}' \
            > "$STAGE/kal-tracker-update.json"

          MANIFEST_SHA="$(sha256_file "$STAGE/kal-tracker-update.json")"
          jq -n \
            --argjson schema 1 \
            --arg sourceRepository "$GITHUB_REPOSITORY" \
            --arg sourceCommit "$RELEASE_SOURCE_SHA" \
            --arg workflowCommit "$GITHUB_SHA" \
            --arg workflowRef "$GITHUB_WORKFLOW_REF" \
            --arg workflowRun "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg releaseRepository "$RELEASES_REPO" \
            --arg releaseTag "$TAG" \
            --arg apkSha256 "$APK_SHA" \
            --arg manifestSha256 "$MANIFEST_SHA" \
            '{schema:$schema,
              source:{repository:$sourceRepository,commit:$sourceCommit},
              workflow:{commit:$workflowCommit,ref:$workflowRef,run:$workflowRun,runAttempt:$workflowRunAttempt},
              release:{repository:$releaseRepository,tag:$releaseTag},
              artifacts:{apkSha256:$apkSha256,manifestSha256:$manifestSha256}}' \
            > "$STAGE/SOURCE.json"
          rm -f "$STAGE/payload.json" "$STAGE/signature.bin"
          (
            cd "$STAGE"
            for asset in "$APK_NAME" kal-tracker-update.json SOURCE.json; do
              printf '%s  %s\n' "$(sha256_file "$asset")" "$asset"
            done > SHA256SUMS
          )
          printf '%s\n' "$RELEASE_NOTES" > "$STAGE/RELEASE_NOTES.md"

          SUMS_SHA="$(sha256_file "$STAGE/SHA256SUMS")"
          SOURCE_SHA="$(sha256_file "$STAGE/SOURCE.json")"
          {
            printf 'TAG=%s\n' "$TAG"
            printf 'APK_NAME=%s\n' "$APK_NAME"
            printf 'STAGE=%s\n' "$STAGE"
            printf 'APK_SHA=%s\n' "$APK_SHA"
            printf 'MANIFEST_SHA=%s\n' "$MANIFEST_SHA"
            printf 'SUMS_SHA=%s\n' "$SUMS_SHA"
            printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"
          } >> "$GITHUB_ENV"
          echo "validazione completata: $TAG pronto per la pubblicazione"

      - name: Recheck signed latest immediately before publish
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-tooling/check_latest_ota_release.sh" \
            --candidate-version "$VERSION" \
            --candidate-build "$BUILD_NUMBER" \
            --public-key-base64 "$OTA_PUBLIC_KEY_BASE64" \
            --expected-key-id "$OTA_KEY_ID" \
            --source-repo "$GITHUB_REPOSITORY" \
            --releases-repo "$RELEASES_REPO"

      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$GH_TOKEN" ]]
          RELEASE_GH_CONFIG="$(mktemp -d "$RUNNER_TEMP/kal-release-gh.XXXXXX")"
          chmod 700 "$RELEASE_GH_CONFIG"
          trap 'find "$RELEASE_GH_CONFIG" -depth -mindepth 1 -delete; rmdir "$RELEASE_GH_CONFIG"' EXIT
          export GH_CONFIG_DIR="$RELEASE_GH_CONFIG"
          export GH_HOST=github.com
          export GH_PROMPT_DISABLED=1
          export GH_PAGER=cat
          test "$(gh repo view "$RELEASES_REPO" --json visibility --jq .visibility)" = PUBLIC

          semver_is_lower_than() {
            local candidate="$1"
            local existing="$2"
            local c_major c_minor c_patch e_major e_minor e_patch
            IFS=. read -r c_major c_minor c_patch <<<"$candidate"
            IFS=. read -r e_major e_minor e_patch <<<"$existing"
            if ((10#$c_major != 10#$e_major)); then
              ((10#$c_major < 10#$e_major))
            elif ((10#$c_minor != 10#$e_minor)); then
              ((10#$c_minor < 10#$e_minor))
            else
              ((10#$c_patch < 10#$e_patch))
            fi
          }

          RELEASE_TAGS="$(gh api --paginate "repos/${RELEASES_REPO}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name')"
          MAX_BUILD=0
          MAX_VERSION=0.0.0
          while IFS= read -r existing_tag; do
            [[ -n "$existing_tag" ]] || continue
            if [[ "$existing_tag" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-b([1-9][0-9]*)$ ]]; then
              EXISTING_VERSION="${BASH_REMATCH[1]}"
              EXISTING_MAJOR="${BASH_REMATCH[2]}"
              EXISTING_MINOR="${BASH_REMATCH[3]}"
              EXISTING_PATCH="${BASH_REMATCH[4]}"
              EXISTING_BUILD="${BASH_REMATCH[5]}"
              for EXISTING_COMPONENT in "$EXISTING_MAJOR" "$EXISTING_MINOR" "$EXISTING_PATCH"; do
                (( ${#EXISTING_COMPONENT} <= 10 && 10#$EXISTING_COMPONENT <= 2147483647 )) || {
                  echo "Tag OTA esistente con SemVer non valida: $existing_tag" >&2
                  exit 1
                }
              done
              (( ${#EXISTING_BUILD} <= 10 )) || {
                echo "Tag OTA esistente con build non valida: $existing_tag" >&2
                exit 1
              }
              (( 10#$EXISTING_BUILD <= 2100000000 )) || {
                echo "Tag OTA esistente oltre il limite Android: $existing_tag" >&2
                exit 1
              }
              (( 10#$EXISTING_BUILD <= MAX_BUILD )) || MAX_BUILD=$((10#$EXISTING_BUILD))
              if semver_is_lower_than "$MAX_VERSION" "$EXISTING_VERSION"; then
                MAX_VERSION="$EXISTING_VERSION"
              fi
            fi
          done <<<"$RELEASE_TAGS"
          if (( BUILD_NUMBER <= MAX_BUILD )); then
            echo "Build $BUILD_NUMBER non crescente: ultima build pubblicata $MAX_BUILD" >&2
            exit 1
          fi

          if semver_is_lower_than "$VERSION" "$MAX_VERSION"; then
            echo "Versione $VERSION precedente alla versione pubblicata $MAX_VERSION" >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "La release $TAG esiste già" >&2
            exit 1
          fi
          gh release create "$TAG" \
            "$STAGE/$APK_NAME" \
            "$STAGE/kal-tracker-update.json" \
            "$STAGE/SHA256SUMS" \
            "$STAGE/SOURCE.json" \
            --repo "$RELEASES_REPO" \
            --title "Kal Tracker $VERSION ($BUILD_NUMBER)" \
            --notes-file "$STAGE/RELEASE_NOTES.md" \
            --draft

          asset_digest() {
            gh release view "$TAG" --repo "$RELEASES_REPO" --json assets \
              --jq ".assets[] | select(.name == \"$1\") | .digest"
          }
          [[ "$(asset_digest "$APK_NAME")" == "sha256:$APK_SHA" ]]
          [[ "$(asset_digest kal-tracker-update.json)" == "sha256:$MANIFEST_SHA" ]]
          [[ "$(asset_digest SHA256SUMS)" == "sha256:$SUMS_SHA" ]]
          [[ "$(asset_digest SOURCE.json)" == "sha256:$SOURCE_SHA" ]]

          gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false --latest

          unset GH_TOKEN
          LATEST_MANIFEST="https://github.com/${RELEASES_REPO}/releases/latest/download/kal-tracker-update.json"
          curl --disable --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 60 --max-filesize 1048576 \
            --retry 5 --retry-all-errors \
            "$LATEST_MANIFEST" -o "$RUNNER_TEMP/remote-manifest.json"
          cmp "$STAGE/kal-tracker-update.json" "$RUNNER_TEMP/remote-manifest.json"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: kal-tracker-release-${{ inputs.version }}-${{ inputs.build_number }}
          path: |
            ${{ runner.temp }}/kal-release/*.apk
            ${{ runner.temp }}/kal-release/kal-tracker-update.json
            ${{ runner.temp }}/kal-release/SHA256SUMS
            ${{ runner.temp }}/kal-release/SOURCE.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove all transient release material
        if: always()
        run: |
          set -euo pipefail
          rm -f -- \
            android/key.properties \
            "$RUNNER_TEMP/remote-manifest.json"
          if [[ -n "${ANDROID_SIGNING_DIR:-}" && -d "$ANDROID_SIGNING_DIR" ]]; then
            rm -f -- "$ANDROID_SIGNING_DIR/kal-tracker-release.jks"
            rmdir "$ANDROID_SIGNING_DIR"
          fi
          if [[ -d "$RUNNER_TEMP/kal-release" ]]; then
            find "$RUNNER_TEMP/kal-release" -type f -delete
            rmdir "$RUNNER_TEMP/kal-release"
          fi
          if [[ -d "$RUNNER_TEMP/release-tooling" ]]; then
            rm -f -- \
              "$RUNNER_TEMP/release-tooling/check_ota_monotonicity.sh" \
              "$RUNNER_TEMP/release-tooling/check_latest_ota_release.sh"
            rmdir "$RUNNER_TEMP/release-tooling"
          fi
          if [[ -n "${OTA_KEY_TEMP:-}" && -d "$OTA_KEY_TEMP" ]]; then
            rm -f -- "$OTA_KEY_TEMP/private.pem" "$OTA_KEY_TEMP/public.pem"
            rmdir "$OTA_KEY_TEMP"
          fi
